spring.application.name=survey-engine

# =========================
# SERVER
# =========================
server.port=8080

# =========================
# FLYWAY (usa STAGING)
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Le decimos explícitamente qué conexión usar
spring.flyway.url=${app.datasource.staging.url}
spring.flyway.user=${app.datasource.staging.username}
spring.flyway.password=${app.datasource.staging.password}

# =========================
# DATASOURCE VERINA (READ ONLY)
# =========================
app.datasource.verina.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
app.datasource.verina.url=jdbc:sqlserver://TU_HOST_VERINA:1433;databaseName=BatteryPlus;encrypt=true;trustServerCertificate=true
app.datasource.verina.username=TU_USUARIO
app.datasource.verina.password=TU_PASSWORD

# =========================
# DATASOURCE STAGING (WRITE)
# =========================
app.datasource.staging.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
app.datasource.staging.url=jdbc:sqlserver://TU_HOST_STAGING:1433;databaseName=SurveyEngine;encrypt=true;trustServerCertificate=true
app.datasource.staging.username=TU_USUARIO
app.datasource.staging.password=TU_PASSWORD

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info