spring.application.name=survey-engine
server.port=8080

# =========================
# ACTUATOR
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=false

# =========================
# FLAGS (enciende/apaga módulos)
# =========================
app.datasource.verina.enabled=false
app.datasource.staging.enabled=false
app.jobs.verinaPull.enabled=false

# =========================
# VERINA (cuando lo habilites)
# =========================
app.datasource.verina.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
app.datasource.verina.url=jdbc:sqlserver://${VERINA_DB_HOST};databaseName=BatteryPlus;encrypt=true;trustServerCertificate=true
app.datasource.verina.username=${VERINA_DB_USER}
app.datasource.verina.password=${VERINA_DB_PASS}
app.datasource.verina.maximum-pool-size=5

# =========================
# STAGING (cuando se instale)
# =========================
app.datasource.staging.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Ejemplo: define estas variables después: STAGING_DB_HOST, STAGING_DB_USER, STAGING_DB_PASS
app.datasource.staging.url=jdbc:sqlserver://${STAGING_DB_HOST};databaseName=SurveyEngine;encrypt=true;trustServerCertificate=true
app.datasource.staging.username=${STAGING_DB_USER}
app.datasource.staging.password=${STAGING_DB_PASS}
app.datasource.staging.maximum-pool-size=5

# =========================
# FLYWAY (solo cuando staging esté listo)
# =========================
spring.flyway.enabled=false

# =========================
# CLIENTIFY
# =========================
app.clientify.base-url=https://api.clientify.net/v1
app.clientify.token=Token ${CLIENTIFY_API_KEY}
app.clientify.custom-fields.ultima-compra-ticket-id=505220
app.clientify.tags.encuesta-satisfaccion=encuesta_satisfaccion